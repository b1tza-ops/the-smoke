{% extends "auth_base.html" %}
{% block title %}Sign in · The Smoke{% endblock %}
{% block content %}
    <p class="eyebrow">Player access</p>
    <h2>Welcome back</h2>
    <p class="muted">Sign in to continue your story.</p>
    <form class="stack-form" method="post">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <label>Username<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">Enter The Smoke <span>→</span></button>
    </form>
    <p class="auth-switch">New to London? <a href="{{ url_for('register') }}">Create an account</a></p>
{% endblock %}
