<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0d"><title>{{ maintenance_title }} · The Smoke</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='turns-1') }}"></head>
<body class="auth-page maintenance-page"><main class="auth-shell auth-shell--single"><section class="auth-card maintenance-card"><div class="maintenance-signal" aria-hidden="true"><i></i><i></i><i></i></div><div class="auth-card__header"><p class="eyebrow">City temporarily closed</p><h2>{{ maintenance_title }}</h2><p>{{ maintenance_message }}</p></div>{% if maintenance_ends_at %}<div class="maintenance-return"><span>Expected reopening</span><strong data-maintenance-end="{{ maintenance_ends_at }}">Calculating…</strong><small>Times are estimates; Operations may reopen the city earlier.</small></div>{% endif %}<a class="primary-button primary-button--link" href="{{ url_for('login') }}"><span>Check again</span><span>↻</span></a></section></main>{% if maintenance_ends_at %}<script>(()=>{const el=document.querySelector('[data-maintenance-end]');if(!el)return;const end=new Date(el.dataset.maintenanceEnd);function draw(){const left=Math.max(0,Math.floor((end-Date.now())/1000));if(!left){el.textContent='Reopening shortly';return}const h=Math.floor(left/3600),m=Math.floor(left%3600/60),s=left%60;el.textContent=(h?h+'h ':'')+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s'}draw();setInterval(draw,1000)})();</script>{% endif %}</body></html>
