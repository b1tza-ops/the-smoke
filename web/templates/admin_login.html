<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b0d"><title>Operations Login · The Smoke</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='item-market-1') }}"></head>
<body class="auth-page"><main class="auth-shell auth-shell--single"><section class="auth-card"><div class="auth-card__header"><p class="eyebrow">Restricted operations</p><h2>Administrator access</h2><p>Use the separate credentials configured on the server.</p></div>{% if error %}<div class="alert"><span class="alert__icon">!</span>{{ error }}</div>{% endif %}<form class="auth-form" method="post"><label class="field"><span>Username</span><input name="username" autocomplete="username" required></label><label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label><button class="primary-button" type="submit"><span>Enter operations</span><span>→</span></button></form></section></main></body></html>
