<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b0d">
    <title>Choose a new password · The Smoke</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='safe-1') }}">
</head>
<body class="auth-page">
    <div class="atmosphere atmosphere--one" aria-hidden="true"></div>
    <div class="atmosphere atmosphere--two" aria-hidden="true"></div>
    <main class="auth-shell auth-shell--single">
        <section class="auth-card" aria-labelledby="reset-title">
            <div class="auth-card__header">
                <p class="eyebrow">Account recovery</p>
                <h2 id="reset-title">Choose a new password</h2>
                <p>Use at least eight characters.</p>
            </div>
            {% if error %}
                <div class="alert" role="alert">
                    <span class="alert__icon" aria-hidden="true">!</span>
                    <span>{{ error }}</span>
                </div>
            {% endif %}
            <form class="auth-form" method="post">
                <input type="hidden" name="token" value="{{ token }}">
                <div class="field">
                    <label for="password">New password</label>
                    <input id="password" type="password" name="password"
                        autocomplete="new-password" minlength="8"
                        maxlength="128" required autofocus>
                </div>
                <div class="field">
                    <label for="password_confirmation">Confirm new password</label>
                    <input id="password_confirmation" type="password"
                        name="password_confirmation"
                        autocomplete="new-password" minlength="8"
                        maxlength="128" required>
                </div>
                <button class="primary-button" type="submit">
                    <span>Update password</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>
        </section>
    </main>
</body>
</html>
