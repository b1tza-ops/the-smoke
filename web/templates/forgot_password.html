<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090b0d">
    <title>Recover your account · The Smoke</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='casino-2') }}">
    <link rel="preconnect" href="https://challenges.cloudflare.com">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body class="auth-page">
    <div class="atmosphere atmosphere--one" aria-hidden="true"></div>
    <div class="atmosphere atmosphere--two" aria-hidden="true"></div>
    <main class="auth-shell auth-shell--single">
        <section class="auth-card" aria-labelledby="recovery-title">
            <div class="auth-card__header">
                <p class="eyebrow">Account recovery</p>
                <h2 id="recovery-title">Forgot your password?</h2>
                <p>Enter your email and we’ll send a 30-minute reset link.</p>
            </div>
            {% if notice %}
                <div class="alert alert--success" role="status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>{{ notice }}</span>
                </div>
            {% endif %}
            {% if error %}
                <div class="alert" role="alert">
                    <span class="alert__icon" aria-hidden="true">!</span>
                    <span>{{ error }}</span>
                </div>
            {% endif %}
            <form class="auth-form" method="post">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email"
                        value="{{ email }}" autocomplete="email"
                        placeholder="Enter your account email"
                        maxlength="254" required autofocus>
                </div>
                <div class="turnstile-wrap">
                    <div class="cf-turnstile"
                        data-sitekey="{{ turnstile_site_key }}"
                        data-action="password_reset"
                        data-theme="dark"
                        data-size="flexible"></div>
                </div>
                <button class="primary-button" type="submit">
                    <span>Send reset link</span>
                    <span aria-hidden="true">→</span>
                </button>
            </form>
            <p class="auth-switch"><a href="{{ url_for('login') }}">Back to sign in</a></p>
        </section>
    </main>
</body>
</html>
